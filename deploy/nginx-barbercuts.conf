# /etc/nginx/sites-available/barbercuts.nl
# Certbot voegt na `certbot --nginx` zelf de ssl_certificate-regels en de http → https redirect toe.

# www → zonder www
server {
    listen 80;
    listen [::]:80;
    server_name www.barbercuts.nl;
    return 301 https://barbercuts.nl$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    http2 on;
    server_name barbercuts.nl;

    root /var/www/barbercuts/current/public;
    index index.php;
    charset utf-8;

    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    # Vite-bestanden hebben een hash in de naam: lang cachen
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
