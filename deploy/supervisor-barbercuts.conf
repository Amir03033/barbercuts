; /etc/supervisor/conf.d/barbercuts.conf
[program:barbercuts-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/barbercuts/current/artisan queue:work redis --tries=3 --max-time=3600 --sleep=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deploy
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/barbercuts/shared/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:barbercuts-staging-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/barbercuts-staging/current/artisan queue:work redis --tries=3 --max-time=3600 --sleep=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deploy
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/barbercuts-staging/shared/storage/logs/queue.log
stopwaitsecs=3600
