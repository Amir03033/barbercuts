# /etc/nginx/sites-available/staging.barbercuts.nl — zelfde als productie, met basic-auth.
server {
    listen 80;
    listen [::]:80;
    server_name staging.barbercuts.nl;

    root /var/www/barbercuts-staging/current/public;
    index index.php;
    charset utf-8;

    client_max_body_size 10M;

    auth_basic "BarberCuts staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uptime-check en Mollie-webhooks moeten zonder wachtwoord bereikbaar zijn
    location = /up { auth_basic off; try_files $uri /index.php?$query_string; }
    location /webhooks/ { auth_basic off; try_files $uri /index.php?$query_string; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
